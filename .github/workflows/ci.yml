name: app1

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ĐÃ XÓA BƯỚC NPM INSTALL NGOÀI MÁY RUNNER VÌ DOCKERFILE ĐÃ TỰ LÀM

      # Build backend từ thư mục ./backend
      - name: Build Backend Docker image
        run: docker build -t hqdu/tapbackend:latest ./backend

      - name: Push Backend Docker image
        run: docker push hqdu/tapbackend:latest

      # Build frontend từ thư mục ./frontend
      - name: Build frontend Docker image
        run: docker build -t hqdu/tapfrontend:latest ./frontend  

      - name: Push frontend Docker image
        run: docker push hqdu/tapfrontend:latest  

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest image
        run: docker pull hqdu/tapbackend:latest

      - name: Pull latest frontend image
        run: docker pull hqdu/tapfrontend:latest  

      - name: Deploy with Docker Compose
        working-directory: /home/hqdu/CICDdocker
        run: docker compose up -d --force-recreate
